# nginx site config for serving the dashboard + data.json from the Pi.
#
# Install:
#   sudo cp deploy/nginx-muriwai-solar.conf /etc/nginx/sites-available/muriwai-solar
#   sudo ln -s /etc/nginx/sites-available/muriwai-solar /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default   # optional, avoids the default nginx page
#   sudo nginx -t && sudo systemctl reload nginx
#
# Assumes:
#   - The built dashboard (`npm run build` -> dist/) is copied to /var/www/muriwai-solar
#   - The Modbus-reading process writes readings to /var/www/muriwai-solar/data.json
#     (same folder as the built app, so the fetch('./data.json') call in the app is
#     same-origin — no CORS setup needed)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/muriwai-solar;
    index index.html;

    # data.json changes every ~30s; never let a browser/proxy cache a stale reading.
    location = /data.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Single-page app: any unknown path falls back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
